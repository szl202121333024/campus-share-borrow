# pytest 配置（PC-13：tests/test_*.py、函数名 test_*）
#
# 正常开发环境：`python -m pytest` 直接可用。
# 受限环境（本机 DSH 文件沙箱）：workspace 根继承了「Everyone 拒绝删除子目录/文件」
# 的 Windows 权限项，pytest 的 tmp_path teardown（rmtree）会被它挡住并在收尾阶段
# 报 PermissionError。保留临时目录可绕开该 teardown；测试断言本身不受影响。
[pytest]
testpaths = tests
tmp_path_retention_policy = none